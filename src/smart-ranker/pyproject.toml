[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ranker"
version = "0.1.0"
description = "Smart Ranker runtime for Immich personal importance scoring"
readme = "docs/設計書.md"
requires-python = ">=3.10"
dependencies = [
	"psycopg[binary]>=3.2,<4",
	"requests>=2.32,<3",
	"scikit-learn>=1.5,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smart_ranker.storage" = ["sql/*.sql"]