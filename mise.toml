[tools]
node = "24.12.0"
pnpm = "10.14.0"
gitleaks = "8.30.1"
pre-commit = "4.6.0"

[tasks.start]
description = "Docker Compose で全コンテナを起動する"
run = "docker compose up -d"

[tasks.end]
description = "Docker Compose で全コンテナを停止する"
run = "docker compose down"

[tasks.update-immich]
description = "Immich を最新バージョンに更新する"
run = "docker compose pull && docker compose up -d"

[tasks.restart]
description = "fzf で起動中の開発用コンテナを 1 つ選び、再ビルドせずに再起動"
run = "bash scripts/tasks/restart.sh"

[tasks.rebuild]
description = "fzf で起動中のコンテナを 1 つ選び、再ビルドして起動"
run = "bash scripts/tasks/rebuild.sh"

[tasks.rebuild-all]
description = "Docker Compose の全コンテナを停止し、再ビルドして起動"
run = "docker compose stop && docker compose rm -f && docker compose up -d --build"

[tasks.hooks-validate]
description = "pre-commit 設定ファイルを検証する"
run = "pre-commit validate-config"

[tasks.hooks-install]
description = "pre-commit hook を Git hooks にインストールする"
run = "pre-commit install"

[tasks.hooks-run]
description = "gitleaks で Git 管理下の内容をスキャンする"
run = "gitleaks git . --redact --verbose"
