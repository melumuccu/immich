
[tasks."cleaner:install"]
description = "immich-cleaner の pnpm 依存をインストールする"
run = """
cd ..
pnpm install
"""

[tasks."cleaner:check"]
description = "immich-cleaner の型チェックを実行する"
run = """
pnpm exec svelte-kit sync && pnpm exec svelte-check --tsconfig ./tsconfig.json
"""

[tasks."cleaner:test"]
description = "immich-cleaner の unit test を実行する"
run = """
pnpm exec vitest run
"""

[tasks."cleaner:build"]
description = "immich-cleaner の production build を作成する"
run = """
pnpm exec svelte-kit sync && pnpm exec vite build
"""

[tasks."cleaner:up"]
description = "immich-cleaner コンテナをビルドして起動する"
run = """
cd ..
docker compose up -d --build immich-cleaner
"""

[tasks."cleaner:logs"]
description = "immich-cleaner コンテナのログを追跡する"
run = """
cd ..
docker compose logs -f immich-cleaner
"""
