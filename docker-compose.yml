services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_PATH}:/usr/src/app/upload/upload
      - ${LIBRARY_PATH}:/usr/src/app/upload/library
      - ${THUMBNAILS_PATH}:/usr/src/app/upload/thumbs
      - ${PROFILE_PATH}:/usr/src/app/upload/profile
      - ${VIDEO_CACHE_PATH}:/usr/src/app/upload/encoded-video
      - ${UPLOAD_BACKUP_PATH}:/usr/src/app/upload/backups
    depends_on:
      - redis
      - database
      - immich-machine-learning
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    environment:
      TZ: ${TZ}
    volumes:
      - ${ML_CACHE_PATH}:/cache
    restart: unless-stopped

  redis:
    container_name: immich_redis
    image: docker.io/redis:7-alpine
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${TZ}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    restart: unless-stopped

  immich-backup:
    container_name: immich_backup
    build:
      context: ./immich-backup
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_KEY_ID}
      RCLONE_CONFIG_B2_KEY: ${B2_APPLICATION_KEY}
    volumes:
      - type: bind
        source: ${LIBRARY_PATH}
        target: /data/library
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IMMICH_APP_PATH}
        target: /data/settings
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    restart: always

  immich-cleaner:
    container_name: immich_cleaner
    build:
      context: .
      dockerfile: immich-cleaner/Dockerfile
      target: dev
    environment:
      TZ: ${TZ}
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: ${IMMICH_CLEANER_IMMICH_API_KEY:-}
      IMMICH_CLEANER_DB_PATH: /app/data/immich-cleaner.sqlite3
      IMMICH_CLEANER_TRASH_METHOD: ${IMMICH_CLEANER_TRASH_METHOD:-DELETE}
      IMMICH_CLEANER_TRASH_FORCE: ${IMMICH_CLEANER_TRASH_FORCE:-false}
      IMMICH_CLEANER_USE_POLLING: ${IMMICH_CLEANER_USE_POLLING:-false}
    ports:
      - 127.0.0.1:${IMMICH_CLEANER_PORT:-2293}:2293
    volumes:
      - ./immich-cleaner/src:/workspace/immich-cleaner/src
      - ./immich-cleaner/var/local:/app/data
    depends_on:
      immich-server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

