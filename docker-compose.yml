# see: https://docs.immich.app/install/docker-compose
x-immich-backup-env: &immich-backup-env
  TZ: ${TZ}
  RCLONE_CONFIG_B2_TYPE: b2
  RCLONE_CONFIG_B2_ACCOUNT: ${B2_KEY_ID}
  RCLONE_CONFIG_B2_KEY: ${B2_APPLICATION_KEY}

x-immich-backup-library-volumes: &immich-backup-library-volumes
  - type: bind
    source: ${UPLOAD_LOCATION}/library
    target: /data/library
    read_only: true
    bind:
      create_host_path: false

x-immich-backup-settings-volumes: &immich-backup-settings-volumes
  - type: bind
    source: ${IMMICH_APP_PATH}
    target: /data/settings
    read_only: true
    bind:
      create_host_path: false

x-immich-backup-common: &immich-backup-common
  build:
    context: ./immich-backup
    dockerfile: Dockerfile
  security_opt:
    - no-new-privileges:true
  restart: always

x-immich-cleaner-env: &immich-cleaner-env
  TZ: ${TZ}
  IMMICH_URL: http://immich-server:2283
  IMMICH_CLEANER_TRASH_METHOD: ${IMMICH_CLEANER_TRASH_METHOD:-DELETE}
  IMMICH_CLEANER_TRASH_FORCE: ${IMMICH_CLEANER_TRASH_FORCE:-false}
  IMMICH_CLEANER_USE_POLLING: ${IMMICH_CLEANER_USE_POLLING:-false}

x-immich-cleaner-common: &immich-cleaner-common
  build:
    context: .
    dockerfile: immich-cleaner/Dockerfile
    target: dev
  volumes:
    - ./immich-cleaner/src:/workspace/immich-cleaner/src
    - ./immich-cleaner/var/local:/app/data
  depends_on:
    immich-server:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
    ports:
      - "2283:2283"
    volumes:
      - type: bind
        source: ${UPLOAD_LOCATION}
        target: /data
        bind:
          create_host_path: false
      - ${THUMB_LOCATION}:/data/thumbs
      - ${PROFILE_LOCATION}:/data/profile
      - ${ENCODED_VIDEO_LOCATION}:/data/encoded-video
      - ${BACKUP_LOCATION}:/data/backups
    depends_on:
      - redis
      - database
      - immich-machine-learning
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    environment:
      TZ: ${TZ}
    volumes:
      - ${ML_CACHE_LOCATION}:/cache
    restart: unless-stopped

  redis:
    container_name: immich_redis
    image: docker.io/redis:7-alpine
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${TZ}
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped

  immich-backup-koki:
    <<: *immich-backup-common
    container_name: immich_backup_koki
    volumes: *immich-backup-library-volumes
    environment:
      <<: *immich-backup-env
      BACKUP_NAME: KOKI
      BACKUP_TEST_ENABLED: ${KOKI_BACKUP_TEST_ENABLED:-false}
      BACKUP_TEST_SOURCE: ${KOKI_BACKUP_TEST_SOURCE}
      BACKUP_TEST_DEST: ${KOKI_BACKUP_TEST_DEST}
      BACKUP_PRODUCTION_ENABLED: ${KOKI_BACKUP_PRODUCTION_ENABLED:-true}
      BACKUP_PRODUCTION_SOURCE: ${KOKI_BACKUP_PRODUCTION_SOURCE}
      BACKUP_PRODUCTION_DEST: ${KOKI_BACKUP_PRODUCTION_DEST}

  immich-backup-mie:
    <<: *immich-backup-common
    container_name: immich_backup_mie
    volumes: *immich-backup-library-volumes
    environment:
      <<: *immich-backup-env
      BACKUP_NAME: MIE
      BACKUP_TEST_ENABLED: ${MIE_BACKUP_TEST_ENABLED:-false}
      BACKUP_TEST_SOURCE: ${MIE_BACKUP_TEST_SOURCE}
      BACKUP_TEST_DEST: ${MIE_BACKUP_TEST_DEST}
      BACKUP_PRODUCTION_ENABLED: ${MIE_BACKUP_PRODUCTION_ENABLED:-true}
      BACKUP_PRODUCTION_SOURCE: ${MIE_BACKUP_PRODUCTION_SOURCE}
      BACKUP_PRODUCTION_DEST: ${MIE_BACKUP_PRODUCTION_DEST}

  immich-backup-settings:
    <<: *immich-backup-common
    container_name: immich_backup_settings
    volumes: *immich-backup-settings-volumes
    environment:
      <<: *immich-backup-env
      BACKUP_NAME: SETTINGS
      BACKUP_TEST_ENABLED: false
      BACKUP_PRODUCTION_ENABLED: false
      BACKUP_SETTINGS_ENABLED: ${SETTINGS_BACKUP_ENABLED:-true}
      BACKUP_SETTINGS_SOURCE: ${SETTINGS_BACKUP_SOURCE}
      BACKUP_SETTINGS_DEST: ${SETTINGS_BACKUP_DEST}

  immich-cleaner-koki:
    <<: *immich-cleaner-common
    container_name: immich_cleaner_koki
    environment:
      <<: *immich-cleaner-env
      IMMICH_API_KEY: ${IMMICH_CLEANER_KOKI_IMMICH_API_KEY:-}
      IMMICH_CLEANER_DB_PATH: /app/data/immich-cleaner-koki.sqlite3
    ports:
      - "${IMMICH_CLEANER_KOKI_PORT:-2293}:2222"

  immich-cleaner-mie:
    <<: *immich-cleaner-common
    container_name: immich_cleaner_mie
    environment:
      <<: *immich-cleaner-env
      IMMICH_API_KEY: ${IMMICH_CLEANER_MIE_IMMICH_API_KEY:-}
      IMMICH_CLEANER_DB_PATH: /app/data/immich-cleaner-mie.sqlite3
    ports:
      - "${IMMICH_CLEANER_MIE_PORT:-2294}:2222"

