[tools]
python = "3.13"

[tasks.install]
description = "`.venv` を作成して smart-ranker の依存をインストールする"
run = """
python -m venv .venv
./.venv/bin/python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
./.venv/bin/python -m pip install -e .
"""

[tasks.bootstrap]
description = "ローカルの保存先ディレクトリと SQLite ストレージを初期化する"
run = """
./.venv/bin/python -m smart_ranker bootstrap-storage --state-dir ./var/local
"""

[tasks.seed-master-data]
description = "設計書準拠の初期 master data を SQLite へ投入する"
run = """
set -eu
set -a
. ../.env
set +a
./.venv/bin/python -m smart_ranker seed-master-data --state-dir ./var/local
"""

[tasks.reset-runtime-data]
description = "learn/score/apply の実行データを消し、設定データは保持したまま初期状態へ戻す"
run = """
./.venv/bin/python -m smart_ranker reset-runtime-data --state-dir ./var/local
"""

[tasks.build]
description = "Compose 経由で smart-ranker の Docker イメージをビルドする"
run = """
cd ..
docker compose --profile smart-ranker build smart-ranker
"""

[tasks.up]
description = "smart-ranker と依存サービスをバックグラウンドで起動する"
run = """
cd ..
docker compose --profile smart-ranker up -d --build smart-ranker
"""

[tasks.dev]
description = "Compose network 内で smart-ranker を起動し、ログを表示する"
run = """
cd ..
docker compose --profile smart-ranker up --build smart-ranker
"""

[tasks.restart]
description = "smart-ranker サービスだけを再ビルドして再作成する"
run = """
cd ..
docker compose --profile smart-ranker up -d --build --force-recreate --no-deps smart-ranker
"""

[tasks.logs]
description = "smart-ranker コンテナのログを追跡する"
run = """
cd ..
docker compose --profile smart-ranker logs -f smart-ranker
"""

[tasks.stop]
description = "smart-ranker サービスだけを停止する"
run = """
cd ..
docker compose --profile smart-ranker stop smart-ranker
"""

[tasks.check]
description = "Web と起動経路の簡易検証を実行する"
run = """
./.venv/bin/python -m unittest tests.test_immich_db_reader tests.test_web_app tests.test_initial_run
"""

[tasks.test]
description = "unittest の全テストを実行する"
run = """
./.venv/bin/python -m unittest discover -s tests -p 'test_*.py'
"""

[tasks.learn]
description = "ローカルの Smart Ranker API から learn ジョブを実行する"
run = """
set -eu
set -a
. ../.env
set +a
curl -s -X POST http://127.0.0.1:${SMART_RANKER_PORT:-8010}/api/jobs/learn \
  -H 'content-type: application/json' \
  -d '{"trigger":"mise-learn"}'
echo
"""

[tasks.score]
description = "ローカルの Smart Ranker API から score ジョブを実行する"
run = """
set -eu
set -a
. ../.env
set +a
curl -s -X POST http://127.0.0.1:${SMART_RANKER_PORT:-8010}/api/jobs/score \
  -H 'content-type: application/json' \
  -d '{"trigger":"mise-score"}'
echo
"""

[tasks.apply]
description = "ローカルの Smart Ranker API から apply ジョブを実行する"
run = """
set -eu
set -a
. ../.env
set +a
curl -s -X POST http://127.0.0.1:${SMART_RANKER_PORT:-8010}/api/jobs/apply \
  -H 'content-type: application/json' \
  -d '{"trigger":"mise-apply"}'
echo
"""

[tasks.job-status]
description = "jobRunId を指定してジョブ状態を取得する"
run = """
set -eu
if [ -z "${JOB_RUN_ID:-}" ]; then
  echo "JOB_RUN_ID を指定してください" >&2
  exit 1
fi
set -a
. ../.env
set +a
curl -s http://127.0.0.1:${SMART_RANKER_PORT:-8010}/api/jobs/${JOB_RUN_ID}
echo
"""

[tasks.review-album-id]
description = "Immich のアルバム名から ID を検索する。既定は Review Album"
run = """
set -eu
set -a
. ../.env
set +a
ALBUM_NAME=${ALBUM_NAME:-Review Album}
./.venv/bin/python -c 'import json, os, sys, urllib.request; album_name=os.environ.get("ALBUM_NAME", "Review Album"); base_url=os.environ.get("SMART_RANKER_IMMICH_BASE_URL") or "http://127.0.0.1:2283"; request=urllib.request.Request(base_url.rstrip("/") + "/api/albums", headers={"Accept": "application/json", "x-api-key": os.environ["SMART_RANKER_IMMICH_API_KEY"]});
with urllib.request.urlopen(request, timeout=10) as response:
    payload = json.load(response)
matches = []
for item in payload:
    name = item.get("albumName") or item.get("name") or ""
    if name == album_name:
        matches.append({"id": item.get("id"), "albumName": name})
print(json.dumps(matches, ensure_ascii=True, indent=2))
sys.exit(0 if matches else 1)'
"""
