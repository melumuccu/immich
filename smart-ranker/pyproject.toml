[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ranker"
version = "0.1.0"
description = "Smart Ranker runtime for Immich personal importance scoring"
readme = "docs/設計書.md"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115,<1",
	"httpx>=0.28,<1",
	"psycopg[binary]>=3.2,<4",
	"requests>=2.32,<3",
	"scikit-learn>=1.5,<2",
	"uvicorn>=0.34,<1",
]

[tool.setuptools]
packages = [
	"smart_ranker",
	"smart_ranker.immich_client",
	"smart_ranker.storage",
	"smart_ranker.web",
]
package-dir = {"smart_ranker" = "src"}

[tool.setuptools.package-data]
"smart_ranker.storage" = ["sql/*.sql"]
"smart_ranker.web" = ["static/*.css", "static/*.html", "static/*.js"]
